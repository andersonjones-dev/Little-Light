<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFF8EA">
<meta name="description" content="Bible stories, memory verses, kindness challenges and a growing garden for children, with a faith-first screen-time routine for parents.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Little Light</title>

<style>
/* VOICE: warm, gentle, encouraging — a storybook, never a classroom
   IDEA: a picture book you open each day, lit by Pip the firefly
   PICTURE: flat storybook scenes (hills, sun, characters) drawn in SVG
   COLOUR and TYPE: sunshine, sky, soft green on warm cream; Baloo 2 + Nunito
   LAYOUT: one-column mobile app, big rounded cards, slim floating tab bar */
:root{color-scheme:light;--sun:#FFC93C;--sun-d:#C98A00;--sky:#7CC6F2;--sky-l:#E3F3FD;--leaf:#8CCB7A;--leaf-l:#E6F4DF;--leaf-d:#3F8A4A;--cream:#FFF8EA;--paper:#FFFDF8;--ink:#2C3A4B;--ink2:#5D6A79;--line:#EFE4CC;--peach:#FFD9C9;--lilac:#E8E0FA;--r:22px}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;height:100%;background:var(--cream);color:var(--ink);font:600 16px/1.5 Nunito,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;font-size:16px}
h1,h2,h3{font-family:'Baloo 2',Nunito,sans-serif;line-height:1.1;margin:0;font-weight:800}
.app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--cream);padding-top:var(--safe-area-inset-top,env(safe-area-inset-top,0px));padding-bottom:max(10px,var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)))}
@supports (height:100lvh){.app{padding-bottom:max(10px,calc(var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)) - clamp(0px,100lvh - 100dvh,60px)))}}
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px 20px}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px 4px}
.top .who{display:flex;align-items:center;gap:8px;background:var(--paper);border-radius:99px;padding:4px 12px 4px 4px;min-height:44px;box-shadow:0 2px 0 var(--line)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:800 17px 'Baloo 2',Nunito,system-ui,sans-serif;flex:none}
.top .sp{flex:1}
.gbtn{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:99px;background:var(--paper);color:var(--ink2);font-size:14px;box-shadow:0 2px 0 var(--line)}
.hello{margin:8px 2px 12px}.hello h1{font-size:30px}.hello p{margin:2px 0 0;color:var(--ink2)}
.card{background:var(--paper);border-radius:var(--r);box-shadow:0 3px 0 var(--line);overflow:hidden;margin-bottom:14px}
.hero .pic{height:170px;position:relative;background:var(--sky-l)}.pic svg{position:absolute;inset:0;width:100%;height:100%}
.hero .body{padding:14px 16px 16px}
.tag{display:inline-block;font-size:12.5px;font-weight:800;color:var(--leaf-d);background:var(--leaf-l);border-radius:99px;padding:3px 10px;margin-bottom:6px}
.tag.sun{color:#8a5d00;background:#FFF0C2}.tag.sky{color:#1d5a85;background:var(--sky-l)}.tag.lil{color:#4b3a85;background:var(--lilac)}.tag.pch{color:#8a3d22;background:var(--peach)}
.hero h2{font-size:25px}.muted{color:var(--ink2);font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:99px;background:var(--sun);color:#3a2a00;font:800 18px 'Baloo 2',Nunito,system-ui,sans-serif;box-shadow:0 4px 0 var(--sun-d)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sun-d)}
.btn.sky{background:var(--sky);color:#0e3550;box-shadow:0 4px 0 #3f93c4}.btn.leaf{background:var(--leaf);color:#173d1c;box-shadow:0 4px 0 #5a9c4a}
.btn.ghost{background:var(--paper);color:var(--ink);box-shadow:0 3px 0 var(--line);font-size:16px}
.btn.wide{width:100%}.btn[disabled]{opacity:.5}
.row{display:flex;align-items:center;gap:12px}
.ring{--p:0;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--leaf) calc(var(--p)*1%),#EFE8D6 0);display:grid;place-items:center;flex:none}
.ring b{width:44px;height:44px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font:800 15px 'Baloo 2',Nunito,system-ui,sans-serif}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-bottom:14px}
.tile{background:var(--paper);border-radius:var(--r);box-shadow:0 3px 0 var(--line);text-align:left;padding:0;overflow:hidden;display:flex;flex-direction:column;min-height:170px}
.tile .pic{height:92px;position:relative}.tile .tx{padding:10px 12px 12px}.tile h3{font-size:18px}.tile .muted{font-size:13.5px;line-height:1.3}
.done-dot{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:800;color:var(--leaf-d)}
.fun{padding:16px;display:flex;gap:14px;align-items:center}
.fun .ic{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;flex:none}
.fun h3{font-size:19px}.fun .muted{font-size:14px;line-height:1.35}
.foot{text-align:center;font-size:13px;color:var(--ink2);padding:6px 0 4px}.foot button{color:var(--ink2);text-decoration:underline;min-height:44px;font-size:13px}
.tabs{margin:0 16px;display:flex;background:var(--paper);border-radius:99px;padding:5px;box-shadow:0 4px 14px rgba(80,60,20,.12)}
.tabs button{flex:1;min-height:46px;border-radius:99px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--ink2);gap:1px}
.tabs button svg{width:22px;height:22px}
.tabs button.on{background:#FFF0C2;color:#6b4a00}
/* full-screen views */
.full{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--cream);padding-top:var(--safe-area-inset-top,env(safe-area-inset-top,0px));padding-bottom:max(10px,var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)))}
@supports (height:100lvh){.full{padding-bottom:max(10px,calc(var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)) - clamp(0px,100lvh - 100dvh,60px)))}}
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--paper);box-shadow:0 2px 0 var(--line);flex:none}
.ib svg{width:22px;height:22px}
.dots{flex:1;display:flex;gap:4px;justify-content:center}.dots i{height:7px;flex:1;max-width:22px;border-radius:9px;background:#EADFC6}.dots i.on{background:var(--sun)}
.scene{aspect-ratio:400/240;max-height:44%;flex:none;position:relative;margin:0 12px;border-radius:26px;overflow:hidden;background:var(--sky-l)}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
.page{flex:1;overflow-y:auto;padding:14px 18px 8px}
.page p.story{font-size:19px;line-height:1.55;margin:6px 0 0;font-weight:700}
.page h2{font-size:26px;margin-top:4px}
.nav{display:flex;gap:10px;padding:8px 16px 0}
.nav .btn{flex:1}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{min-height:54px;border-radius:18px;background:var(--paper);box-shadow:0 3px 0 var(--line);text-align:left;padding:10px 16px;font-size:17px;font-weight:800;display:flex;align-items:center;gap:10px}
.opt.right{background:var(--leaf-l);box-shadow:0 3px 0 var(--leaf)}.opt.soft{background:#FFF0C2;box-shadow:0 3px 0 #F2D27A}.opt.sel{background:var(--sky-l);box-shadow:0 3px 0 var(--sky)}
.fb{margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--leaf-l);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{min-height:44px;padding:0 16px;border-radius:99px;background:var(--paper);box-shadow:0 2px 0 var(--line);font-weight:800;font-size:15px}
.chip.on{background:var(--sky);color:#0e3550;box-shadow:0 2px 0 #3f93c4}
.read{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:99px;background:var(--sky-l);color:#1d5a85;font-size:14px;font-weight:800;margin-top:10px}
/* verse */
.verse{font:800 26px/1.3 'Baloo 2',Nunito,system-ui,sans-serif;text-align:center;padding:18px 10px 6px}
.ref{text-align:center;color:var(--ink2);font-size:14px}
.slots{display:grid;gap:8px;margin-top:14px}
.slot{min-height:52px;border-radius:16px;border:2px dashed #E3D6B8;display:flex;align-items:center;padding:0 14px;font-weight:800;font-size:18px;color:var(--ink2)}
.slot.fill{border:2px solid var(--leaf);background:var(--leaf-l);color:var(--ink)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:center}
.wt{min-height:50px;padding:0 16px;border-radius:16px;background:#FFF0C2;box-shadow:0 3px 0 #F2D27A;font-weight:800;font-size:17px}
.wt.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
/* overlays */
.ov{position:absolute;inset:0;background:rgba(44,58,75,.35);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:12px}
.sheet{background:var(--paper);border-radius:28px;width:100%;max-width:460px;padding:20px 18px calc(18px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)));max-height:92%;overflow-y:auto}
.ov.mid{align-items:center}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.pinpad button{min-height:60px;border-radius:18px;background:var(--cream);font:800 24px 'Baloo 2',Nunito,system-ui,sans-serif;box-shadow:0 3px 0 var(--line)}
.pd{display:flex;gap:14px;justify-content:center;margin-top:14px}.pd i{width:16px;height:16px;border-radius:50%;border:2px solid #CDBF9F}.pd i.on{background:var(--ink);border-color:var(--ink)}
.cele svg{width:100%;height:150px;display:block}
/* parent */
.pmode{background:#F4F6F8}.pmode .main{padding-top:4px}
.pchips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none}.pchips::-webkit-scrollbar{display:none}
.pchips button{flex:none;min-height:40px;padding:0 14px;border-radius:99px;background:#fff;font-weight:800;font-size:14px;color:var(--ink2);border:1px solid #E1E6EC}
.pchips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pc{background:#fff;border-radius:18px;border:1px solid #E6EAEF;padding:14px 16px;margin-bottom:12px}
.pc h3{font-size:19px;margin-bottom:4px}
.li{display:flex;align-items:center;gap:10px;min-height:52px;border-top:1px solid #EEF1F4}.li:first-of-type{border-top:0}
.li .lab{flex:1;font-weight:700}.li .lab small{display:block;color:var(--ink2);font-weight:600;font-size:13px}
.step{display:flex;align-items:center;gap:6px}.step button{width:44px;height:44px;border-radius:12px;background:#F1F4F7;font:800 22px 'Baloo 2',Nunito,system-ui,sans-serif}.step b{min-width:64px;text-align:center}
.li.col{flex-direction:column;align-items:stretch;gap:6px}.li.col .seg button{flex:1}
.seg{display:flex;background:#F1F4F7;border-radius:12px;padding:3px;gap:3px}.seg button{min-height:40px;padding:0 10px;border-radius:10px;font-size:14px;font-weight:800;color:var(--ink2)}.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.stat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.stat div{background:#F6F8FA;border-radius:14px;padding:10px 12px}.stat b{font:800 22px 'Baloo 2',Nunito,system-ui,sans-serif;display:block}.stat span{font-size:13px;color:var(--ink2)}
.note{font-size:13.5px;color:var(--ink2);background:#FFF7E0;border-radius:12px;padding:10px 12px;margin-top:8px}
.tin{flex:1;min-height:44px;border:1px solid #DDE3EA;border-radius:12px;padding:0 12px;background:#fff}
.xs{min-height:44px;padding:0 12px;border-radius:12px;background:#F1F4F7;font-weight:800;font-size:14px}
.xs.warn{background:#FFE9DF;color:#8a3d22}
details{border-top:1px solid #EEF1F4;padding:6px 0}details summary{min-height:44px;display:flex;align-items:center;font-weight:800;cursor:pointer}
ol.steps{margin:6px 0 0;padding-left:20px}ol.steps li{margin:4px 0}
.badge{font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;background:#F1F4F7;color:var(--ink2)}
.badge.ok{background:var(--leaf-l);color:var(--leaf-d)}.badge.wait{background:#FFF0C2;color:#7a5400}
.timer{width:220px;height:220px;margin:10px auto;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--sky) calc(var(--p)*1%),#E7EEF3 0)}
.timer div{width:180px;height:180px;border-radius:50%;background:var(--cream);display:grid;place-items:center;text-align:center}
.timer b{font:800 46px 'Baloo 2',Nunito,system-ui,sans-serif;display:block;line-height:1}
.honest{display:flex;gap:10px;align-items:flex-start;background:var(--sky-l);border-radius:16px;padding:12px 14px;font-size:14px;color:#1d4a6b}
.applist{max-height:420px;overflow-y:auto;margin-top:8px}.applist .li img{width:36px;height:36px;border-radius:9px;flex:none}
.tog{width:52px;height:32px;border-radius:99px;background:#D7DEE5;position:relative;flex:none}.tog::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}.tog.on{background:var(--leaf-d)}.tog.on::after{left:23px}
.perm{display:flex;align-items:center;gap:10px;min-height:56px;border-top:1px solid #EEF1F4}.perm:first-of-type{border-top:0}.perm .ok{color:var(--leaf-d);font-weight:800}
.big{font:800 22px 'Baloo 2',Nunito,system-ui,sans-serif}
.pickgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}
.pick{background:var(--paper);border-radius:24px;box-shadow:0 3px 0 var(--line);padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font:800 20px 'Baloo 2',Nunito,system-ui,sans-serif}
.pick .av{width:72px;height:72px;font-size:32px}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.9);opacity:0}}}
@media (min-width:700px){.main{padding-left:max(16px,calc(50% - 320px));padding-right:max(16px,calc(50% - 320px))}.tabs{align-self:center;width:480px}.scene{max-height:48%;align-self:center;width:min(100% - 24px,760px)}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="capacitor.js"></script>
<script>
{
/* ---------- data ---------- */
const KEY='littlelight-proto-v1';
const dk=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const AV=[['#FFC93C','#6b4a00'],['#7CC6F2','#0e3550'],['#8CCB7A','#173d1c'],['#F6A9C0','#6e1f3d'],['#C9B8F0','#3b2c75']];
const fresh=()=>({children:[{id:'c1',name:'Asha',av:0},{id:'c2',name:'Noah',av:1}],cur:null,pin:null,set:{faith:10,fun:30,rule:'either',approval:'optional',apps:['YouTube Kids','Drawing app']},prog:{},stories:{dg:true,gs:true,jf:true,zm:true}});
let S=null;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.set)S=fresh();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const P=id=>S.prog[id]||(S.prog[id]={days:{},garden:0,stars:0,stories:0,verses:0,kind:0,acts:0});
const D=id=>{const p=P(id),k=dk();return p.days[k]||(p.days[k]={faithSec:0,appSec:0,story:false,verse:false,kind:false,approved:false,fun:null})};
const kid=()=>S.children.find(c=>c.id===S.cur);
const U={view:'home',step:0,ans:{},ptab:'today',ov:null,pin:'',pinMode:null,pinFirst:'',pinAfter:null,vs:[],vtiles:[],confirm:null,kindIx:0};

/* ---------- Android helper (only inside the Android app) ---------- */
const NATIVE=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
const G=NATIVE&&window.capacitorExports?capacitorExports.registerPlugin('Guard'):null;
let GS=null;
async function gStatus(){if(!G)return null;try{GS=await G.status()}catch(e){GS=null}return GS}
async function gCall(fn,arg){if(!G)return null;try{GS=await G[fn](arg||{})}catch(e){}return GS}
const guardOn=()=>!!(GS&&GS.enabled&&GS.usageAccess&&GS.overlay);
if(!S.set.blockApps)S.set.blockApps=[];

/* ---------- content ---------- */
const STORIES=[
 {id:'dg',t:'David and Goliath',th:'Courage and trusting God',sub:'A true story about being brave and trusting God',ref:'1 Samuel 17',ready:true,col:'#E3F3FD'},
 {id:'gs',t:'The Good Samaritan',th:'Kindness and loving others',ref:'Luke 10:25–37',col:'#E6F4DF'},
 {id:'jf',t:'Joseph Forgives',th:'Forgiveness',ref:'Genesis 37–50 (Genesis 45)',col:'#E8E0FA'},
 {id:'zm',t:'Zacchaeus Makes It Right',th:'Honesty and making things right',ref:'Luke 19:1–10',col:'#FFE8DD'}];
const PROMPTS={dg:['When have you felt brave? What helped you?','David used something he already knew how to do: his sling. What gifts has God given you?','What is one "giant" our family could pray about together?'],
 gs:['Who was the good neighbour in the story? How do you know?','Who might need kindness at school, church or home this week?','How can we help someone who is different from us?'],
 jf:['How do you think Joseph felt when his brothers came to Egypt?','Why can forgiving someone feel hard?','Is there someone we need to forgive, or ask to forgive us?'],
 zm:['How did Zacchaeus change after meeting Jesus?','What does "making it right" look like after we do something wrong?','Jesus went to Zacchaeus\'s house. How can our family welcome others?']};
const DG=[
 {k:'read',sc:'camp',ref:'1 Samuel 17:1–3',x:'Long ago, two armies faced each other across a valley. God\'s people, the Israelites, camped on one hill. The Philistine army camped on the hill across from them.'},
 {k:'read',sc:'giant',ref:'1 Samuel 17:4–11, 16',x:'The Philistines had a champion called Goliath. He was a giant, much taller than anyone else, and he wore heavy bronze armour. Morning and evening, for forty days, he shouted a challenge for someone to come and fight him. King Saul\'s soldiers were very afraid.'},
 {k:'read',sc:'shepherd',ref:'1 Samuel 17:12–23',x:'David was the youngest son in his family, and he looked after his father\'s sheep. One day his father sent him to the army camp with food for his older brothers. While he was there, David heard Goliath\'s challenge.'},
 {k:'ask',sc:'think',q:'Imagine you were in the camp. How might you feel hearing the giant shout?',o:['Scared','Curious','Brave','Not sure'],f:'Thank you for sharing! Any feeling is okay. Even grown-up soldiers felt scared. Let\'s see what David did.'},
 {k:'read',sc:'king',ref:'1 Samuel 17:32–37',x:'David told King Saul that he would go and fight Goliath. Saul said David was too young. But David explained that while he was guarding the sheep, God had helped him rescue them from a lion and a bear. He trusted that God would help him again.'},
 {k:'read',sc:'armour',ref:'1 Samuel 17:38–40',x:'Saul dressed David in his own armour and helmet. They were so big and heavy that David could hardly walk! So he took them off. He took his shepherd\'s staff and his sling, and chose five smooth stones from a stream.'},
 {k:'quiz',sc:'stones',q:'How many smooth stones did David choose?',o:['Three','Five','Ten'],a:1,f:'Yes! Five smooth stones from the stream.',w:'Good try! Look again: David chose five smooth stones.'},
 {k:'read',sc:'face',ref:'1 Samuel 17:41–47',x:'Goliath made fun of David because he was young. David answered that Goliath came with a sword and spear, but David came in the name of the Lord. He said everyone would see that the battle belongs to God.'},
 {k:'read',sc:'win',ref:'1 Samuel 17:48–52',x:'David ran toward Goliath, put a stone in his sling and let it fly. The stone hit Goliath on the forehead, and the giant fell to the ground. The Philistine army ran away, and God\'s people were safe.'},
 {k:'quiz',sc:'think',q:'Who did David trust to help him?',o:['His big brothers','King Saul\'s armour','God'],a:2,f:'That\'s right. David trusted God, just like he did with the lion and the bear.',w:'Good thinking! David trusted God to help him, not armour or anyone else.'},
 {k:'lesson',sc:'pip',x:'When something feels big and scary, I can trust God to be with me. Being brave doesn\'t mean never feeling afraid. It means trusting God even when we do.',v:'“When I am afraid, I will put my trust in you.”',vr:'Psalm 56:3 (WEB)'},

 if(o.t==='about')return `<div class="ov mid"><div class="sheet pop" style="max-width:380px"><div class="row"><h2 style="flex:1;font-size:26px">Little Light</h2><button class="ib" data-act="closeov" aria-label="Close">${I.x}</button></div><p class="muted">Small steps in faith make a big difference.</p><p>Designed by Anderson Jones.<br>© 2026 Anderson Jones. All rights reserved.</p><p class="muted">Feedback: andy.andersonjones@gmail.com</p><p class="muted" style="font-size:13px">Test version. Everything is saved only on this device. No ads, no tracking, no accounts.</p></div></div>`;

 if(type==='story'){p.stories++;p.acts++}if(type==='verse'){p.verses++;p.acts++}if(type==='kind')p.kind++;

function openPin(after,msg){U.pin='';U.pinFirst='';U.pinMode=S.pin?'check':'set';U.pinAfter=after;U.ov={t:'pin',msg};render()}

 if(ds.pin){if(ds.pin==='del')U.pin=U.pin.slice(0,-1);else if(U.pin.length<4)U.pin+=ds.pin;U.ov.err='';

 if(ds.st){const [k,v]=ds.st.split(':');const lim=k==='faith'?[5,60]:[5,180];S.set[k]=Math.min(lim[1],Math.max(lim[0],S.set[k]+ +v));save();if(k==='fun')gCall('configure',{allowanceSec:S.set.fun*60}).then(render);render();return}

 if(ds.pkg){const i=S.set.blockApps.findIndex(a=>a.pkg===ds.pkg);if(i>=0)S.set.blockApps.splice(i,1);else{const a=(U.apps||[]).find(x=>x.pkg===ds.pkg);S.set.blockApps.push({pkg:ds.pkg,label:a?a.label:ds.pkg})}save();t.classList.toggle('on');gCall('configure',{blocked:S.set.blockApps.map(a=>a.pkg)}).then(()=>{const sc=app.querySelector('.applist');const st=sc?sc.scrollTop:0;const m=app.querySelector('.main');const ms=m?m.scrollTop:0;render();const sc2=app.querySelector('.applist');if(sc2)sc2.scrollTop=st;const m2=app.querySelector('.main');if(m2)m2.scrollTop=ms});return}
 if(ds.set){const [k,v]=ds.set.split(':');S.set[k]=v;save();render();return}
